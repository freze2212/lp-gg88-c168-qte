    window.DYNAMIC_TARGET = "https://www.09llwin.com/?id=546865495";
    window.DYNAMIC_TELE = "https://www.09llwin.com/?id=546865495";

    (function() {
      try {
        fetch('/domains.json?v=' + Date.now())
          .then(function(r) { return r.json(); })
          .then(function(dj) {
            if (!dj) return;
            var h = (window.location.hostname || '').toLowerCase().replace(/^www\./, '');
            var entry = dj[h] || dj['www.' + h] || dj[window.location.hostname];
            if (entry) {
              var target = entry.main_url || entry.url || entry.link;
              if (target) {
                window.DYNAMIC_TARGET = target;
                window.DYNAMIC_TELE = entry.telegram_url || entry.tele || target;
                document.querySelectorAll('a').forEach(function(a) { a.href = target; });
              }
            }
          }).catch(function(){});
      } catch(e){}

      document.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (a) {
          e.preventDefault();
          window.open(window.DYNAMIC_TARGET || a.href, '_blank');
        }
      }, true);
    })();
  </script>
